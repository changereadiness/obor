name: OBOR Daily Intelligence

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  intelligence:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run collection and publishing pipeline
        run: python scripts/run.py

      - name: Quality gate
        run: python scripts/validate.py

      - name: Commit generated intelligence
        run: |
          git config user.name "OBOR Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update daily intelligence"
          git push
