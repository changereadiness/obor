<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Risks — OBOR</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="/">OBOR</a><span class="descriptor">China Economic Intelligence for Canadian Business</span><nav><a href="/signals/">Signals</a><a href="/opportunities/">Opportunities</a><a href="/risks/">Risks</a><a href="/sectors/">Sectors</a><a href="/about/">About</a></nav></div></header><main class="wrap" style="padding:70px 0"><p class="eyebrow">RISKS</p><h1 style="font-family:Georgia,serif;font-size:52px;font-weight:500">Developments that may increase exposure or downside for Canadian business.</h1><div id="list" class="signal-grid" style="margin-top:40px"></div></main><script>fetch('/data/signals.json').then(r=>r.json()).then(a=>{let x=a.filter(s=>s.opportunity_or_risk==='RISK');document.querySelector('#list').innerHTML=x.length?x.map(s=>`<article class="signal-card"><div class="meta"><span class="tag">RISK</span><span>OBOR ${s.relevance_score}/100</span></div><h3>${s.title}</h3><p>${s.summary}</p></article>`).join(''):'<p>No risks are currently published.</p>'})</script></body></html>
