<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signals — OBOR</title><meta name="description" content="China economic signals relevant to Canadian business."><link rel="canonical" href="https://obor.ca/signals/"><link rel="stylesheet" href="/assets/style.css"></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="/">OBOR</a><span class="descriptor">China Economic Intelligence for Canadian Business</span><nav><a href="/signals/">Signals</a><a href="/opportunities/">Opportunities</a><a href="/risks/">Risks</a><a href="/sectors/">Sectors</a><a href="/about/">About</a></nav></div></header><main class="wrap" style="padding:64px 0"><p class="eyebrow">SIGNALS</p><h1 style="font-family:Georgia,serif;font-size:52px;font-weight:500;line-height:1.05">China developments with Canadian business relevance.</h1><div id="archive" class="signal-grid" style="margin-top:40px"></div></main><script>fetch('/data/signals.json').then(r=>r.json()).then(a=>document.querySelector('#archive').innerHTML=a.map(s=>`<article class="signal-card"><div class="meta"><span class="tag">${s.opportunity_or_risk}</span><span>OBOR ${s.relevance_score}/100</span></div><h3><a href="/signals/${s.slug}/" style="color:inherit;text-decoration:none">${s.title}</a></h3><p>${s.summary}</p></article>`).join(''))</script></body></html>
